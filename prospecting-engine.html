<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prospecting Engine — Cascade GTM</title>
<meta name="description" content="Prospecting Engine — a signal-driven GTM prospecting command center. Portfolio demo by Cascade GTM. Mock data; nothing is sent." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Inter:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   Prospecting Engine — Cascade GTM
   A portfolio demo. Static, mock data, no send capability by design.
   Single file, no build step, no runtime dependencies (fonts only).
   Drop on GitHub Pages as index.html and it runs.
   =================================================================== */

:root{
  --ink:#16241e;          /* deep spruce — primary text */
  --paper:#f6f4ee;        /* warm paper — app ground */
  --card:#ffffff;         /* surfaces */
  --cascade:#0e7c66;      /* cascade teal — primary accent */
  --cascade-soft:#e3f0ea; /* teal tint */
  --cascade-deep:#0a5e4d;
  --nectar:#c2562a;       /* terracotta — reserved for P1 "act now" only */
  --nectar-soft:#f7e7df;
  --line:#e4e0d6;         /* hairline */
  --line-2:#efece4;
  --muted:#6f756c;        /* secondary text */
  --muted-2:#9aa097;
  --p2:#0e7c66;
  --p3:#8a8f87;
  --ok:#2f7d5b;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(22,36,30,.04), 0 8px 24px -16px rgba(22,36,30,.22);
  --shadow-lift:0 2px 4px rgba(22,36,30,.05), 0 24px 48px -24px rgba(22,36,30,.30);
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --mono:'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
a{color:inherit}
button{font-family:inherit}
::selection{background:var(--cascade-soft)}

/* ---------- App shell ---------- */
.app{display:grid; grid-template-columns:248px 1fr; min-height:100vh}
/* The mobile menu backdrop must be out of flow on desktop, or it steals a grid cell. */
.scrim{display:none; position:fixed; inset:0; background:rgba(22,36,30,.4); z-index:55}
.scrim.show{display:block}

.sidebar{
  grid-column:1;
  position:sticky; top:0; height:100vh; align-self:start;
  background:#fbfaf6; border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:22px 16px;
}
.brand{display:flex; align-items:center; gap:11px; padding:6px 8px 18px}
.brand .mark{width:34px; height:34px; flex:none; color:var(--cascade)}
.brand .wordmark{line-height:1.05}
.brand .eyebrow{font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted-2); font-weight:600}
.brand .name{font-family:var(--serif); font-size:17px; font-weight:560; letter-spacing:-.01em; line-height:1.12}

.nav{display:flex; flex-direction:column; gap:2px; margin-top:6px}
.nav-label{font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted-2); font-weight:600; padding:14px 10px 6px}
.nav a{
  display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:var(--radius-sm);
  color:var(--ink); text-decoration:none; font-weight:500; font-size:13.5px;
  cursor:pointer; transition:background .15s ease, color .15s ease;
}
.nav a svg{width:17px; height:17px; flex:none; color:var(--muted); transition:color .15s ease}
.nav a:hover{background:var(--line-2)}
.nav a.active{background:var(--cascade-soft); color:var(--cascade-deep); font-weight:600}
.nav a.active svg{color:var(--cascade)}
.nav a .count{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:1px 7px}
.nav a.active .count{color:var(--cascade-deep); border-color:#cfe6dd; background:#fff}

.side-foot{margin-top:auto; padding-top:16px; border-top:1px solid var(--line)}
.who{display:flex; align-items:center; gap:10px; padding:6px 8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--cascade);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none}
.who .nm{font-weight:600;font-size:12.5px;line-height:1.2}
.who .rl{font-size:11px;color:var(--muted)}

/* ---------- Main ---------- */
.main{grid-column:2; min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:20; background:rgba(246,244,238,.86); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); padding:16px 34px;
  display:flex; align-items:flex-end; gap:16px;
}
.topbar .titles{min-width:0}
.topbar .crumb{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted-2); font-weight:600}
.topbar h1{font-family:var(--serif); font-weight:540; font-size:27px; letter-spacing:-.015em; margin:3px 0 0}
.topbar h1 em{font-style:italic; color:var(--cascade-deep)}
.topbar .right{margin-left:auto; display:flex; align-items:center; gap:12px}
.demo-pill{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:600; color:var(--cascade-deep);
  background:#fff; border:1px solid #cfe6dd; border-radius:30px; padding:5px 12px}
.demo-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--cascade);box-shadow:0 0 0 3px var(--cascade-soft)}
.date{font-family:var(--mono); font-size:12px; color:var(--muted)}

.content{padding:28px 34px 60px; max-width:1180px}

/* ---------- Reusable ---------- */
.eyebrow{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted-2); font-weight:600}
.h-sec{font-family:var(--serif); font-weight:540; font-size:20px; letter-spacing:-.01em; margin:0}
.sub{color:var(--muted); font-size:13px; margin:4px 0 0}
.row{display:flex; gap:16px}
.grid{display:grid; gap:16px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.card.pad{padding:20px}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin:34px 0 14px}
.section-head:first-child{margin-top:4px}

.badge{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; border-radius:30px; padding:3px 9px; white-space:nowrap}
.badge .d{width:6px;height:6px;border-radius:50%}
.badge.p1{color:#9a3d18; background:var(--nectar-soft)} .badge.p1 .d{background:var(--nectar)}
.badge.p2{color:var(--cascade-deep); background:var(--cascade-soft)} .badge.p2 .d{background:var(--p2)}
.badge.p3{color:#5d6259; background:#eceae2} .badge.p3 .d{background:var(--p3)}
.badge.ghost{color:var(--muted); background:var(--line-2)}
.badge.chan{background:#eef3f6; color:#36586a}
.badge.chan.email{background:#f1eef6; color:#574a6b}

.chip{font-family:var(--mono); font-size:11px; color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:7px; padding:2px 7px}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; font-weight:600; font-size:13px;
  border-radius:var(--radius-sm); padding:9px 15px; border:1px solid var(--line); background:#fff; color:var(--ink); transition:all .15s ease}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--muted-2)}
.btn.primary{background:var(--cascade); border-color:var(--cascade); color:#fff}
.btn.primary:hover{background:var(--cascade-deep); border-color:var(--cascade-deep)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
.btn.ghost:hover{background:var(--line-2); color:var(--ink)}
.btn.sm{padding:6px 11px; font-size:12px}
.btn:focus-visible, .nav a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
  outline:2px solid var(--cascade); outline-offset:2px}

/* ---------- Metric tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
.tile{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow)}
.tile .lab{font-size:11px; letter-spacing:.04em; color:var(--muted); font-weight:500; display:flex; align-items:center; gap:7px}
.tile .lab svg{width:14px;height:14px;color:var(--cascade)}
.tile .val{font-family:var(--serif); font-size:34px; font-weight:540; letter-spacing:-.02em; margin-top:8px; line-height:1}
.tile .delta{font-family:var(--mono); font-size:11.5px; margin-top:8px; color:var(--muted)}
.tile .delta.up{color:var(--ok)} .tile .delta .arw{font-weight:600}

/* ---------- Tables ---------- */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:#fff; box-shadow:var(--shadow)}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:640px}
thead th{
  text-align:left; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600;
  padding:12px 16px; border-bottom:1px solid var(--line); background:#fbfaf6; white-space:nowrap; position:sticky; top:0}
tbody td{padding:13px 16px; border-bottom:1px solid var(--line-2); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s ease}
tbody tr:hover{background:#fbfaf6; cursor:default}
.co{font-weight:600}
.dom{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
.tnum{font-family:var(--mono); font-size:12px; color:var(--muted)}
.fresh{font-family:var(--mono); font-size:12px}
.fresh.hot{color:var(--nectar)}
.name-cell{display:flex; align-items:center; gap:11px}
.name-cell .av{width:30px;height:30px;border-radius:50%;background:var(--cascade-soft);color:var(--cascade-deep);display:grid;place-items:center;font-weight:600;font-size:11px;flex:none}

.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.search{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 12px; flex:1; min-width:200px; max-width:340px}
.search svg{width:15px;height:15px;color:var(--muted)}
.search input{border:0; outline:0; font-family:var(--sans); font-size:13px; width:100%; background:transparent; color:var(--ink)}
.seg{display:inline-flex; background:#fff; border:1px solid var(--line); border-radius:var(--radius-sm); padding:3px; gap:2px}
.seg button{border:0; background:transparent; padding:6px 11px; border-radius:7px; font-size:12px; font-weight:600; color:var(--muted); cursor:pointer}
.seg button.on{background:var(--cascade-soft); color:var(--cascade-deep)}

/* ---------- Prospecting hover card (signature) ---------- */
.prospect-wrap{display:grid; grid-template-columns:1fr 320px; gap:24px; align-items:start}
.hovercard{position:relative; background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow-lift); overflow:hidden;
  animation:settle .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes settle{from{opacity:0; transform:translateY(10px) scale(.992)} to{opacity:1; transform:none}}
.hc-top{padding:22px 26px 0}
.hc-step{display:flex; align-items:center; justify-content:space-between; gap:12px}
.hc-step .n{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.06em}
.hc-why{margin:16px 0 0; padding:14px 16px; border-radius:12px; background:var(--nectar-soft); border:1px solid #f0d8cc}
.hc-why.warm{background:var(--cascade-soft); border-color:#cfe6dd}
.hc-why .lab{font-size:10px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:#9a3d18}
.hc-why.warm .lab{color:var(--cascade-deep)}
.hc-why p{margin:5px 0 0; font-size:13.5px; color:var(--ink); line-height:1.45}
.hc-person{display:flex; align-items:center; gap:14px; padding:20px 26px}
.hc-person .av{width:46px;height:46px;border-radius:50%;background:var(--cascade);color:#fff;display:grid;place-items:center;font-weight:600;font-size:16px;flex:none}
.hc-person .pn{font-family:var(--serif); font-size:19px; font-weight:540; letter-spacing:-.01em}
.hc-person .pt{font-size:12.5px; color:var(--muted)}
.hc-person .pmeta{margin-left:auto; text-align:right; display:flex; flex-direction:column; gap:4px; align-items:flex-end}
.hc-draft{padding:0 26px 8px}
.hc-draft .dlab{display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.04em; color:var(--muted); font-weight:600; margin-bottom:8px}
.hc-draft .dlab .sparkle{color:var(--cascade)}
.hc-draft textarea{width:100%; min-height:152px; resize:vertical; border:1px solid var(--line); border-radius:12px; padding:15px 16px;
  font-family:var(--sans); font-size:13.5px; line-height:1.6; color:var(--ink); background:#fcfbf8}
.hc-draft textarea:focus{background:#fff; border-color:var(--cascade)}
.hc-foot{display:flex; align-items:center; gap:10px; padding:16px 26px 22px; border-top:1px solid var(--line-2); flex-wrap:wrap}
.hc-foot .spacer{flex:1}
.hc-note{font-size:11.5px; color:var(--muted-2); display:flex; align-items:center; gap:6px}

.queue-side .card{padding:6px}
.queue-side h3{font-family:var(--serif); font-weight:540; font-size:15px; margin:14px 12px 8px}
.qitem{display:flex; gap:11px; padding:11px 12px; border-radius:11px; cursor:pointer; transition:background .12s}
.qitem:hover{background:#fbfaf6}
.qitem.active{background:var(--cascade-soft)}
.qitem .qav{width:30px;height:30px;border-radius:50%;background:var(--line-2);color:var(--muted);display:grid;place-items:center;font-weight:600;font-size:11px;flex:none}
.qitem.active .qav{background:#fff;color:var(--cascade-deep)}
.qitem .qn{font-weight:600; font-size:12.5px; line-height:1.25}
.qitem .qc{font-size:11.5px; color:var(--muted)}
.qitem.done{opacity:.5}
.qitem.done .qn{text-decoration:line-through}

.empty{display:grid; place-items:center; text-align:center; padding:60px 20px; gap:12px}
.empty .e-mark{width:54px;height:54px;color:var(--cascade);opacity:.8}
.empty h3{font-family:var(--serif); font-weight:540; font-size:20px; margin:0}
.empty p{color:var(--muted); margin:0; max-width:380px}

/* ---------- Sequences / Segments ---------- */
.seq-card{padding:0; overflow:hidden}
.seq-head{padding:18px 22px; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--line-2)}
.seq-head .meta{margin-left:auto; display:flex; gap:8px; align-items:center}
.seq-title{font-family:var(--serif); font-size:17px; font-weight:540}
.steps{padding:8px 22px 18px}
.step{display:grid; grid-template-columns:34px 1fr auto; gap:14px; align-items:start; padding:15px 0; border-bottom:1px solid var(--line-2); position:relative}
.step:last-child{border-bottom:0}
.step .sn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--cascade);color:var(--cascade-deep);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;background:#fff;margin-top:2px}
.step .saction{font-weight:600; font-size:13.5px}
.step .sdraft{font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.5}
.step .swait{font-family:var(--mono); font-size:11.5px; color:var(--muted-2); white-space:nowrap}
.connector{position:absolute; left:13px; top:42px; bottom:-1px; width:1.5px; background:var(--line)}
.step:last-child .connector{display:none}

.segcard{padding:20px; display:flex; flex-direction:column; gap:14px}
.segcard .st{display:flex; align-items:center; justify-content:space-between}
.segcard .sname{font-family:var(--serif); font-size:17px; font-weight:540}
.segcard .sdesc{font-size:12.5px; color:var(--muted); line-height:1.5}
.segcard .meta-row{display:flex; gap:18px; padding-top:12px; border-top:1px solid var(--line-2)}
.segcard .meta-row .mi .k{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-2); font-weight:600}
.segcard .meta-row .mi .v{font-weight:600; font-size:13px; margin-top:3px; display:flex; align-items:center; gap:6px}

/* ---------- Reporting ---------- */
.funnel{display:flex; flex-direction:column; gap:9px}
.fstage{display:grid; grid-template-columns:130px 1fr 56px; align-items:center; gap:14px}
.fstage .fl{font-size:12.5px; font-weight:500}
.fbar{height:30px; border-radius:8px; background:var(--cascade); display:flex; align-items:center; position:relative; min-width:30px; transition:width .8s cubic-bezier(.2,.8,.2,1)}
.fstage .fv{font-family:var(--mono); font-size:13px; font-weight:600; text-align:right}
.fstage .fr{font-family:var(--mono); font-size:10.5px; color:var(--muted-2); position:absolute; right:10px; color:#fff; opacity:.85}

.legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:4px}
.legend .li{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted)}
.legend .li .sw{width:11px;height:11px;border-radius:3px}

.barset{display:flex; flex-direction:column; gap:13px}
.barrow{display:grid; grid-template-columns:150px 1fr 46px; align-items:center; gap:12px}
.barrow .bl{font-size:12.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bartrack{height:9px; background:var(--line-2); border-radius:20px; overflow:hidden}
.barfill{height:100%; border-radius:20px; transition:width .8s cubic-bezier(.2,.8,.2,1)}
.barrow .bv{font-family:var(--mono); font-size:12px; text-align:right; color:var(--muted)}

/* ---------- Settings ---------- */
.field{margin-bottom:16px; max-width:420px}
.field label{display:block; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:7px}
.field input{width:100%; border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 13px; font-family:var(--sans); font-size:13.5px; background:#fff; color:var(--ink)}
.integration{display:flex; align-items:center; gap:14px; padding:16px 18px; border-bottom:1px solid var(--line-2)}
.integration:last-child{border-bottom:0}
.integration .ico{width:38px;height:38px;border-radius:10px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--serif);font-weight:600;color:var(--cascade-deep);font-size:16px;flex:none}
.integration .iname{font-weight:600; font-size:13.5px}
.integration .irole{font-size:12px; color:var(--muted)}
.integration .istate{margin-left:auto; display:flex; align-items:center; gap:10px}

.callout{display:flex; gap:13px; padding:15px 18px; border-radius:12px; background:var(--cascade-soft); border:1px solid #cfe6dd; color:var(--cascade-deep); font-size:13px; line-height:1.5}
.callout svg{width:18px;height:18px;flex:none;margin-top:1px}
.callout strong{font-weight:700}

.activity{display:flex; flex-direction:column}
.act{display:flex; gap:13px; padding:13px 0; border-bottom:1px solid var(--line-2)}
.act:last-child{border-bottom:0}
.act .ad{width:8px;height:8px;border-radius:50%;background:var(--cascade);margin-top:6px;flex:none}
.act .at{font-size:13px}
.act .am{font-family:var(--mono); font-size:11px; color:var(--muted-2); margin-left:auto; white-space:nowrap}

.legend-key{font-size:12px; color:var(--muted); line-height:1.6}
.legend-key b{color:var(--ink); font-weight:600}
.legend-key .k{font-family:var(--mono); color:var(--nectar)}

/* ---------- Toast ---------- */
.toasts{position:fixed; bottom:24px; right:24px; z-index:100; display:flex; flex-direction:column; gap:10px}
.toast{background:var(--ink); color:#fff; padding:13px 16px; border-radius:12px; box-shadow:var(--shadow-lift);
  display:flex; align-items:center; gap:11px; font-size:13px; font-weight:500; animation:tin .3s ease both; max-width:340px}
.toast svg{width:17px;height:17px;color:#7fd8c0;flex:none}
.toast .tsub{color:#b9c2bc; font-weight:400; font-size:11.5px}
@keyframes tin{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

/* ---------- Mobile ---------- */
.menu-btn{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .main{grid-column:1}
  .sidebar{position:fixed; inset:0 auto 0 0; width:248px; transform:translateX(-100%); transition:transform .25s ease; z-index:60; box-shadow:var(--shadow-lift)}
  .sidebar.open{transform:none}
  .scrim{display:none; position:fixed; inset:0; background:rgba(22,36,30,.4); z-index:55}
  .scrim.show{display:block}
  .menu-btn{display:inline-grid; place-items:center; width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .menu-btn svg{width:18px;height:18px}
  .content,.topbar{padding-left:18px; padding-right:18px}
  .prospect-wrap{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){

function donut(parts){
  const total=parts.reduce((a,p)=>a+p[1],0); let acc=0; const R=52, C=2*Math.PI*R;

  return `<div style="display:grid;place-items:center;padding:6px 0 14px"><svg width="140" height="140" viewBox="0 0 140 140">${segs}<text x="70" y="66" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="540" fill="#16241e">${parts[0][1]}%</text><text x="70" y="84" text-anchor="middle" font-size="10" fill="#6f756c" font-family="Inter, sans-serif" letter-spacing="1">LINKEDIN</text></svg></div>`;
}

$('#nav').addEventListener('click',e=>{const a=e.target.closest('a[data-tab]'); if(a) render(a.dataset.tab);});

// delegated content clicks
content.addEventListener('click',e=>{
  const goto=e.target.closest('[data-goto]'); if(goto){render(goto.dataset.goto); return;}
  const qsel=e.target.closest('[data-q]'); if(qsel){activeQ=qsel.dataset.q; if(Q.find(x=>x.id===activeQ&&x.status==='pending')) render('prospecting'); return;}
  const reset=e.target.closest('[data-reset]'); if(reset){Q.forEach(q=>q.status='pending'); activeQ=Q[0].id; refreshCounts(); render('prospecting'); toast('Demo queue reset','8 steps back in the queue'); return;}
  const act=e.target.closest('[data-act]'); if(act){handleAct(act.dataset.act); return;}
  const f=e.target.closest('#coSeg [data-f]'); if(f){coFilter=f.dataset.f; $('#coBody').innerHTML=coRows(); document.querySelectorAll('#coSeg button').forEach(b=>b.classList.toggle('on',b.dataset.f===coFilter)); return;}
  const cf=e.target.closest('#ctSeg [data-f]'); if(cf){ctSeg=cf.dataset.f; $('#ctBody').innerHTML=ctRows(); document.querySelectorAll('#ctSeg button').forEach(b=>b.classList.toggle('on',b.dataset.f===ctSeg)); return;}
});
content.addEventListener('input',e=>{
  if(e.target.id==='coSearch'){coQuery=e.target.value; $('#coBody').innerHTML=coRows();}
  if(e.target.id==='ctSearch'){ctQuery=e.target.value; $('#ctBody').innerHTML=ctRows();}
});

function handleAct(a){
  const q=Q.find(x=>x.id===activeQ);
  if(a==='send'){
    if(q){q.status='sent'; const ta=$('#draft'); q.draft=ta?ta.value:q.draft;}
    toast('Sent (demo)', `${q?q.c.first+' '+q.c.last:''} · ${q?q.ch:''} — nothing actually left the page`);
    advance(); refreshCounts(); render('prospecting');
  } else if(a==='skip'){
    if(q){q.status='skipped';}
    toast('Skipped', 'Removed from today’s queue');
    advance(); refreshCounts(); render('prospecting');
  } else if(a==='regen'){
    const ta=$('#draft'); if(ta){ta.value = reword(ta.value); toast('Redrafted','A fresh take from Claude (demo text)');}
  } else if(a==='noconnect'){
    toast('Connections are off in the demo','The live app keeps keys server-side');
  }
}
function advance(){const next=Q.find(q=>q.status==='pending'); activeQ=next?next.id:null;}
function reword(t){
  const openers=['Quick note — ','Hi there — ','Hello — '];
  return openers[Math.floor(Math.random()*openers.length)] + t.replace(/^(Hi|Hello|Congrats|Hey|Quick note —|Hi there —|Hello —)[^\n]*\n?/,'').trim();
}

/* toast */
function toast(title,sub){
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`${ic('done-mark')}<div><div>${title}</div>${sub?`<div class="tsub">${sub}</div>`:''}</div>`;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s, transform .3s'; t.style.opacity='0'; t.style.transform='translateY(8px)'; setTimeout(()=>t.remove(),300);},3200);
}

/* mobile menu */
function closeMenu(){$('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show');}
$('#menuBtn').addEventListener('click',()=>{$('#sidebar').classList.add('open'); $('#scrim').classList.add('show');});
$('#scrim').addEventListener('click',closeMenu);

/* init */
/* init — guarded so the app can never silently render blank */
function boot(){
  try{
    $('#today').textContent = fmtToday;
    refreshCounts();
    render('home');
  }catch(err){
    const c = document.getElementById('content');
    if(c) c.innerHTML = '<div class="card pad" style="margin:20px;color:#9a3d18;line-height:1.6">'
      + 'The app failed to start.<br><span class="dom">'+(err&&err.message?err.message:err)+'</span></div>';
    console.error('boot:', err);
  }
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
</script>
</body>
</html>
